name: Hertz deal monitor

on:
  schedule:
    # Every 2 hours, off the round hour so GitHub schedules it promptly.
    # A private repo has 2,000 free Actions minutes a month; this cadence
    # uses roughly 1,200. A 15-minute cron would exhaust the allowance in
    # about four days and then stop silently.
    - cron: "11 */2 * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Force the digest email"
        type: boolean
        default: false
      dry_run:
        description: "Score and render but send nothing"
        type: boolean
        default: false
      force:
        description: "Re-poll every watch now, ignoring poll windows"
        type: boolean
        default: false

# Never let two runs write the database at once.
concurrency:
  group: hertz-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        # The runner image ships Google's Chrome apt repo pre-configured, and
        # that repo intermittently serves a stale index which fails EVERY
        # apt-get update with a hash-sum mismatch, even when the package being
        # installed has nothing to do with Google. Drop it before touching apt.
        run: |
          # deb822 format on current images (google-chrome.sources), so match
          # any extension, then sweep anything else still pointing at Google.
          sudo rm -f /etc/apt/sources.list.d/google*
          sudo grep -l "dl.google.com" /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          python -m playwright install --with-deps chromium chromium-headless-shell

      - name: Install real Chrome (CarMax only)
        # CarMax rejects bundled Chromium, so it needs real Chrome. This pulls
        # from Google's apt repo, which intermittently serves a stale index and
        # fails on a hash-sum mismatch. That must not take the run down: the
        # pipeline logs and skips the CarMax sweep when Chrome is absent, and
        # every other source still works.
        continue-on-error: true
        run: |
          # Fetch the .deb directly rather than through Google's apt index,
          # which is what breaks. Playwright's channel="chrome" finds the
          # system install at /opt/google/chrome on its own.
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          google-chrome --version

      - name: Run the monitor
        env:
          HERTZ_SMTP_USER: ${{ secrets.HERTZ_SMTP_USER }}
          HERTZ_SMTP_PASSWORD: ${{ secrets.HERTZ_SMTP_PASSWORD }}
          HERTZ_EMAIL_TO: ${{ secrets.HERTZ_EMAIL_TO }}
          HERTZ_NTFY_TOPIC: ${{ secrets.HERTZ_NTFY_TOPIC }}
          # In CI the database belongs inside the repo so price history is
          # committed. Locally it defaults outside Dropbox, which corrupts
          # SQLite by syncing the -wal/-shm sidecars independently.
          HERTZ_DB_PATH: ${{ github.workspace }}/data/hertz.db
          PYTHONUTF8: "1"
        run: |
          python -m hertz \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.digest && '--digest' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            --quiet

      - name: Persist database and board
        # History is the product here: price drops and days-on-lot only exist
        # because every run's observations are committed back.
        run: |
          git config user.name  "hertz-monitor[bot]"
          git config user.email "hertz-monitor@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "No inventory changes to record."
          else
            git commit -m "Record inventory snapshot $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Report a dead run
        # A run that dies before Python starts (browser install, checkout)
        # never reaches the monitor's own failure alert, so three early
        # deaths in a row went unheard. Say so from the workflow itself.
        if: ${{ failure() || cancelled() }}
        run: |
          curl -fsS -X POST "https://ntfy.sh/${{ secrets.HERTZ_NTFY_TOPIC }}" \
            -H "Title: Hertz monitor run died" -H "Priority: high" -H "Tags: warning" \
            -d "Run ${{ github.run_id }} did not complete; inventory is stale until one does. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
