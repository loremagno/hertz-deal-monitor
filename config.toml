# Hertz deal monitor — configuration.
#
# Secrets are NOT stored here. They come from environment variables so this
# file is safe to commit:
#   HERTZ_SMTP_USER, HERTZ_SMTP_PASSWORD, HERTZ_EMAIL_TO, HERTZ_NTFY_TOPIC
#
# Model matching is done LOCALLY against the full inventory pull, using
# case-insensitive substring matching. That deliberately sidesteps Hertz's
# exact-string trap, where "CX-50" and "CX-50 Hybrid" are distinct model
# values and filtering on the wrong one silently returns nothing.

[location]
zip = "43220"                 # Upper Arlington / Columbus, OH
# These pin the search origin via cookies. Without them Hertz has no location
# for the session: every vehicle comes back with a null distance and the
# radius filter is silently ignored. They also make results independent of
# where the job runs, which matters on GitHub Actions runners.
city_state = "COLUMBUS, OH, US"
coordinates = "40.0464,-83.0680"
alert_radius_miles = 300      # push alerts only for cars you could drive to
# Mention a national car in the digest only if it beats the best drivable
# car by at least this much, on landed cost. Set to 0 to always mention.
national_mention_min_saving = 1500

[economics]
# Franklin County OH: 5.75% state + 1.25% county + 0.50% COTA LinkUS levy
# (effective April 2025). Verified 2026-09-09 for the 43220 jurisdiction.
sales_tax_rate = 0.080
title_reg_fees = 100          # title + registration, approximate
tax_applies_to_delivery = false
# Ohio does not tax the dealer doc fee, so the taxable base is the
# no-haggle price rather than the quoted Hertz Price.
tax_excludes_doc_fee = true

# Hertz quotes delivery on each vehicle page; these are the fallback when the
# quote cannot be read. Calibrated 2026-09-08 from two live quotes:
# Cincinnati 86 mi -> $316, Phoenix 1656 mi -> $3,464.
[economics.delivery]
base = 145.0
per_mile = 2.00

# Five-year cost of ownership, as shown on the board. Resale uses each
# model's own market curve where one exists (XC60 -9.4%/yr, CX-70 -7.5%),
# else this default, with the fitted mileage slope; fuel from the car's
# EPA figures at the mileage chosen on the page; a reserve when the
# bumper-to-bumper warranty has run out.
fuel_price = 3.20
depreciation_per_year = -0.08
warranty_reserve = 1500

[carmax]
# CarMax prices shipping per car and shows it on the results page. Anything
# dearer than this is not worth the freight.
max_shipping = 499

[github]
# Followed listings live as open issues labelled "follow" on this repo; the
# board's star button pre-fills one, closing it un-follows. Issues must be
# enabled on the repo for this to work.
repo = "loremagno/hertz-deal-monitor"

[condition]
# Reading a car's history costs two page loads and the answer is good for a
# fortnight, so the board can afford a verdict on every car Lorenzo could
# actually drive to, not just the ones heading for an alert. On 2026-09-17
# the drivable board was 91 cars with 3 verdicts between them, which is the
# one column he most needs and the thing he was burned by. At 30 a run the
# backfill takes about three runs and then only new arrivals cost anything.
survey_per_run = 30
survey_seconds = 360
retry_days = 14

[preferences]
# Soft preferences, not filters. A car that misses them still appears on the
# board and can still alert; the board and the alert say how it differs.
colors = ["blue", "slate", "gray", "grey", "graphite", "machine"]
trims = ["Premium Plus"]
odometer_ideal = 20000
odometer_tolerance = 8000     # "ideally under 20k, but not much more"
# Starting values for the cost view's selectors; the page lets you change
# both, because how much you will drive is the open question.
miles_per_year = 12000
holding_years = 5

[scoring]
# A residual is only trusted when the car's model has at least this many
# observations in the fit; below that the model dummy is doing the work.
min_comps = 12
# A car must be at least this many dollars below prediction before the
# percentage test is even considered, to avoid alerting on rounding noise.
min_abs_discount = 400
# When a Cars.com curve exists for a model, the within-inventory fit gets
# weight n / (n + K) and the curve the rest: nine XC60s -> 31% inventory,
# 69% market; sixty CX-50 Hybrids -> 75% inventory.
market_blend_k = 20
# Markdown alerts, on watches that set `markdown_alert = true`. A car that
# arrives at prediction and is cut week by week until it is genuinely cheap
# used to say nothing: arrival alerts fire once, and the value gate wants
# the tier bar. It must now sit at or below this many standard deviations
# under its own model, and the cut must be at least this much money. On the
# board of 2026-09-17, 573 drops in one run left exactly one car past -1.5.
#
# EITHER bar passes. One alone does not work across models: the XC60 is
# scored against a Cars.com curve whose spread is 6.0% of price, so -1.5
# sigma there means -9% and never fires, while the CX-50 Hybrid sits on the
# within-inventory fit at a 3.2% spread. Over the first eight days of price
# history the sigma bar alone fired 0 times and the percentage bar once, on
# a certified XC60 thirteen miles away that had been cut $600.
markdown_pct = -5.0
markdown_sigma = -1.5
markdown_min_drop = 250

[alerts]
enable_email = true
enable_push = true
digest_every_days = 3
# Never re-alert the same VIN unless its price falls another N dollars.
realert_price_drop = 500

[email]
smtp_server = "smtp.gmail.com"
smtp_port = 587

[push]
# ntfy.sh — free, no account. Pick an unguessable topic name and subscribe
# to it in the ntfy app. Set via HERTZ_NTFY_TOPIC.
server = "https://ntfy.sh"

# ---------------------------------------------------------------------------
# Watchlist. Tier A is the real target and alerts on a modest discount.
# Tier B is opportunistic: it only fires on an exceptional discount.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Sources. Both run Dealer.com, so identical code reads them.
# ---------------------------------------------------------------------------

[[source]]
name = "hertz"
base_url = "https://www.hertzcarsales.com"
search_path = "/all-inventory/index.htm"   # includes the Rent2Buy fleet

[[source]]
name = "byers-mazda"
base_url = "https://www.byersmazda.com"
search_path = "/used-inventory/index.htm"

[[source]]
name = "byers-volvo"
base_url = "https://www.byersvolvo.com"
search_path = "/certified-inventory/index.htm"   # certified pre-owned only

# Avis Car Sales: the second ex-rental channel, and another Dealer.com site,
# so the Hertz reader works unchanged. 1,594 cars nationwide on 2026-09-14,
# 408 under 25k miles, 29 CX-50 Hybrids (lowest 22k). Cars carry postal
# codes, so distances work; no Rent2Buy, no delivery quote on the page (the
# per-mile fallback applies); doc fee not in the price.
[[source]]
name = "avis"
base_url = "https://www.aviscarsales.com"
search_path = "/used-inventory/index.htm"

[[watch]]
tier = "A"
group = "primary"
label = "Mazda CX-50 Hybrid"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "hertz"
models = ["CX-50 Hybrid"]
threshold_pct = -3.0
national = true
year_min = 2025
odometer_max = 35000
poll_hours = 0.25
max_pages = 10
alert_on_new = true
new_max_residual_pct = 3.0

[[watch]]
tier = "A"
group = "primary"
label = "Mazda CX-50 Hybrid (Avis)"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "avis"
models = ["CX-50 Hybrid"]
exclude_base_trims = true     # Avis stocks Preferred too; Hertz never did
threshold_pct = -3.0
national = true
year_min = 2025
odometer_max = 35000
poll_hours = 2
max_pages = 4
alert_on_new = true
new_max_residual_pct = 3.0

[[watch]]
tier = "B"
group = "hertz"
label = "Other Avis finds"
source = "avis"
models = ["Atlas", "GV70", "GV80", "CX-90", "CX-70", "XC60", "V60 Cross Country",
          "Sorento", "Telluride", "Santa Fe", "Santa Fe Hybrid", "Palisade",
          "C-Class", "GLA 250", "GLB 250", "GLE"]
threshold_pct = -8.0
national = false
year_min = 2024
odometer_max = 35000
poll_hours = 8
max_pages = 3
alert_on_new = true
new_max_residual_pct = 0.0
exclude_trims = ["Base", "SE Base", "Preferred", "3.3 Turbo Preferred", "LE", "LX", "S", "SE"]

# ---------------------------------------------------------------------------
# Enterprise Car Sales, low-mileage only. Its stock skews high-mileage
# (median 54k within 300 mi, 5% under 25k), so the reader applies the
# mileage cap and model year at the API and the watch names MAKES, not
# models: the API filters by make. Enterprise cars are inspected, carry a
# 12-month/12k powertrain warranty and a 7-day repurchase, and are stored
# as certified. Radius = alert_radius_miles.
# ---------------------------------------------------------------------------

[[watch]]
tier = "A"
group = "primary"
label = "Mazda CX-50 Hybrid (Enterprise)"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "enterprise"
makes = ["Mazda"]
models = ["CX-50 Hybrid"]
exclude_base_trims = true
threshold_pct = -3.0
year_min = 2025
odometer_max = 25000
poll_hours = 6
alert_on_new = true
new_max_residual_pct = 3.0

[[watch]]
tier = "B"
group = "hertz"
label = "Low-mileage Enterprise finds"
source = "enterprise"
makes = ["Mazda", "Volvo", "Hyundai", "Kia", "Toyota", "Honda", "Volkswagen", "Subaru", "Genesis", "Lexus", "Audi", "Mercedes-Benz"]
year_min = 2024
odometer_max = 25000
price_min = 22000
price_max = 40000
body_styles = ["SUV", "Crossover", "Sedan", "Wagon"]
exclude_base_trims = true
threshold_pct = -8.0
# No board bar: this lane is under twenty low-mileage cars, all worth seeing;
# the Hertz sweep's bars exist because that lane is hundreds.
poll_hours = 12
alert_on_new = false
new_max_residual_pct = 0.0

# ---------------------------------------------------------------------------
# Other Hertz finds: the named upgrade list, polled daily.
# ---------------------------------------------------------------------------

[[watch]]
tier = "B"
group = "hertz"
label = "Other Hertz finds"
source = "hertz"
models = [
    "Atlas",                      # Volkswagen
    "GV70", "GV80",               # Genesis
    "CX-90",                      # Mazda -- Preferred excluded below
    "V60 Cross Country",          # Volvo: appears at Hertz (3 today)
    "Sorento", "Telluride",       # Kia: 25 Sorento at Hertz (LX/S only -> excluded below); Telluride 0
    "Santa Fe", "Santa Fe Hybrid",  # Hyundai: 1,290 Santa Fe, all SEL
    "C-Class", "GLA 250", "GLB 250", "GLE",   # Mercedes: 262 at Hertz, mostly GLA/GLB 250
]
threshold_pct = -8.0
national = false
year_min = 2024
odometer_max = 35000
poll_hours = 8
max_pages = 5
alert_on_new = true
new_max_residual_pct = 0.0
# Prefix-matched against the trim. Highlander is dropped from the list
# outright: Hertz stocks only the LE. CX-90 "Preferred" and "3.3 Turbo
# Preferred" are the base trims; Premium Sport and above stay.
exclude_trims = ["Base", "SE Base", "Preferred", "3.3 Turbo Preferred", "LE", "LX", "S", "SE"]

[[watch]]
tier = "B"
group = "hertz"
label = "Hyundai Palisade (2026 only)"
source = "hertz"
models = ["Palisade"]
threshold_pct = -8.0
year_min = 2026
odometer_max = 35000
poll_hours = 6
max_pages = 5
alert_on_new = true
new_max_residual_pct = 0.0

# ---------------------------------------------------------------------------
# Broad Hertz finds: a wider net for a nice, underpriced car in the
# $28-35k band. NOT the whole catalogue: that band is 10,551 cars (440
# pages) of Blazers, Rogues and Tiguans, and geoRadius is silently ignored,
# so "scan everything" is noise. This is a curated list of models Lorenzo
# would plausibly want, polled every two days, cheapest page each, and it
# alerts only on an exceptional discount. Add or drop models freely.
# ---------------------------------------------------------------------------

[[watch]]
tier = "B"
group = "hertz"
label = "Broad Hertz finds"
source = "hertz"
models = [
    "CX-50",                       # the gas sibling of the target
    "CX-5", "CX-90 PHEV",
    "RAV4 Hybrid", "Sienna", "Camry Hybrid",   # Highlander dropped: LE only at Hertz
    "CR-V Hybrid", "Accord Hybrid",
    "Santa Fe Hybrid", "Tucson Hybrid", "Sorento Hybrid", "Sportage Hybrid",
    "Outback", "Forester",
    "XC40", "S60",
    "Q5", "A4", "A6",
    "GLC", "C-Class",
    "X3", "3 Series",
]
threshold_pct = -8.0
national = false
year_min = 2024
odometer_max = 35000
poll_hours = 48
max_pages = 2
alert_on_new = false
new_max_residual_pct = 0.0
exclude_trims = ["Base", "SE Base", "Preferred", "3.3 Turbo Preferred", "LE", "LX", "S", "SE"]

# ---------------------------------------------------------------------------
# Very discounted, any trim. Lorenzo: "if base models, show me also VERY VERY
# discounted cars." Same models as Other Hertz finds plus the ones excluded
# there, with NO trim exclusions, and a bar of -10% below prediction. On the
# current distribution (p5 -5.5%, min -12.5%) that is a genuine outlier, so
# this lane fires rarely and only for something worth a second look.
# ---------------------------------------------------------------------------

[[watch]]
tier = "B"
group = "hertz"
label = "Very discounted, any trim"
source = "hertz"
models = ["Highlander", "CX-90", "Atlas", "GV80", "Palisade", "Sienna", "RAV4 Hybrid", "CX-50", "CX-5"]
threshold_pct = -10.0
board_max_residual_pct = -10.0   # the board shows this lane only past its bar
min_sigma = -2.0                 # ...and only two of the model's own sigmas below
national = false
year_min = 2024
odometer_max = 35000
poll_hours = 24
max_pages = 3
alert_on_new = false
new_max_residual_pct = 0.0

# ---------------------------------------------------------------------------
# Hertz 2026 sweep (2026-09-14). No model list: every 2026 car of these
# makes that Hertz prices between $25k and $35k, under 25k miles, as an
# SUV, sedan or wagon. Hertz applies the band, the mileage cap and the
# body styles server-side; the make's own trim ladder (hertz/trims.py)
# drops base trims (a Palisade SEL stays, an Audi Premium goes). The board
# shows a sweep car only at 6% or more below its benchmark; an alert needs
# 8% and a clean AutoCheck; and any make|model Hertz has never sold before
# gets one quiet push the run it appears. Sorted by mileage, capped per
# make, so the low-mileage end is what gets seen. Add or drop makes freely.
# ---------------------------------------------------------------------------

[[watch]]
tier = "B"
group = "hertz"
label = "Hertz 2026 sweep"
source = "hertz"
sweep = true
makes = ["Audi", "Mazda", "Volvo", "Mercedes-Benz", "Volkswagen", "Honda", "Toyota",
         "Genesis", "Lexus", "Subaru", "Hyundai", "Kia"]
year_min = 2026
year_max = 2026
price_min = 25000
price_max = 35000
odometer_max = 25000
body_styles = ["SUV", "Sedan", "Wagon"]
exclude_base_trims = true
threshold_pct = -8.0
board_max_residual_pct = -6.0
min_sigma = -2.0
national = false
poll_hours = 48
max_pages = 12
alert_on_new = false
new_max_residual_pct = 0.0

# ---------------------------------------------------------------------------
# SUV watchlist: XC60 (Plus only, 2024-25) and CX-70 (3.3, Premium or better).
# Brown interiors are flagged on the board by score.interior_tier; the CX-70
# entries below no longer REQUIRE brown, they prefer it. Mazda's 3.3 ladder
# is Preferred < Premium Sport < Premium Plus / S Premium, so requiring
# "3.3" and "Premium" admits every trim above Preferred.
# ---------------------------------------------------------------------------

[[watch]]
tier = "A"
group = "suv"
label = "Byers certified XC60"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "byers-volvo"
models = ["XC60"]
require_trims = ["Plus"]
market_make = "volvo"
market_slug = "volvo-xc60"
threshold_pct = -2.0
national = false
year_min = 2024
year_max = 2025
odometer_max = 35000
poll_hours = 2
max_pages = 3
alert_on_new = true
new_max_residual_pct = 99.0

[[watch]]
tier = "A"
group = "suv"
label = "CarMax XC60"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "carmax"
models = ["XC60"]
require_trims = ["Plus"]
carmax_make = "volvo"
carmax_model = "xc60"
market_make = "volvo"
market_slug = "volvo-xc60"
threshold_pct = -2.0
year_min = 2024
year_max = 2025
odometer_max = 35000
poll_hours = 3
alert_on_new = true
new_max_residual_pct = 99.0

[[watch]]
tier = "A"
group = "suv"
label = "Hertz XC60"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "hertz"
models = ["XC60"]
require_trims = ["Plus"]
market_make = "volvo"
market_slug = "volvo-xc60"
threshold_pct = -2.0
year_min = 2024
year_max = 2025
odometer_max = 35000
poll_hours = 2
max_pages = 3
alert_on_new = true
new_max_residual_pct = 99.0

[[watch]]
tier = "A"
group = "suv"
label = "CX-70 (Hertz)"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "hertz"
models = ["CX-70"]
require_trims = ["Premium"]   # any-of: "Premium Sport", "Premium Plus", "S Premium"; excludes Preferred
# Only these colour combinations (2026-09-13): gray or blue outside, brown
# family inside. Exterior is a substring match ("Polymetal Gray Metallic",
# "Machine Gray", "Deep Crystal Blue Mica"); interior is whole-word.
require_exterior = ["gray", "grey", "graphite", "machine", "polymetal", "blue"]
require_interior = ["tan", "brown", "cognac", "caramel", "saddle", "terracotta", "russet",
                    "mocha", "chestnut", "hazel", "amber", "tobacco", "nougat", "walnut",
                    "sienna", "camel", "toffee", "maple"]
market_make = "mazda"
market_slug = "mazda-cx_70"
threshold_pct = -2.0
year_min = 2024
odometer_max = 35000
poll_hours = 2
max_pages = 3
alert_on_new = true
new_max_residual_pct = 99.0

[[watch]]
tier = "A"
group = "suv"
label = "CX-70 (Byers Mazda)"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "byers-mazda"
models = ["CX-70"]
require_trims = ["Premium"]   # any-of: "Premium Sport", "Premium Plus", "S Premium"; excludes Preferred
# Only these colour combinations (2026-09-13): gray or blue outside, brown
# family inside. Exterior is a substring match ("Polymetal Gray Metallic",
# "Machine Gray", "Deep Crystal Blue Mica"); interior is whole-word.
require_exterior = ["gray", "grey", "graphite", "machine", "polymetal", "blue"]
require_interior = ["tan", "brown", "cognac", "caramel", "saddle", "terracotta", "russet",
                    "mocha", "chestnut", "hazel", "amber", "tobacco", "nougat", "walnut",
                    "sienna", "camel", "toffee", "maple"]
market_make = "mazda"
market_slug = "mazda-cx_70"
threshold_pct = -2.0
year_min = 2024
odometer_max = 35000
poll_hours = 3
max_pages = 3
alert_on_new = true
new_max_residual_pct = 99.0
