# ---------------------------------------------------------------------------
# Sources. Both run Dealer.com, so identical code reads them.
# ---------------------------------------------------------------------------

[[source]]
name = "hertz"
base_url = "https://www.hertzcarsales.com"
search_path = "/all-inventory/index.htm"   # includes the Rent2Buy fleet

# Franchise dealers are `kind = "dealer"`: their feed's `msrp` is the
# manufacturer's sticker (not Hertz's pre-doc price), the advertised price
# carries the state doc fee, and you drive there rather than pay delivery.
[[source]]
name = "byers-mazda"
base_url = "https://www.byersmazda.com"
search_path = "/used-inventory/index.htm"   # certified and plain used together
kind = "dealer"

# Byers's NEW inventory, same Dealer.com feed with a `pricing` block: the
# sticker, the $398 Ohio doc fee, a $50 delivery line, and the manufacturer
# cash the dealer advertises ("SICRule"). 26 CX-50/CX-70 on 2026-09-21,
# listed at sticker plus fees, so "vs sticker" reads about +0.2% there and
# the negotiation is the whole game.
[[source]]
name = "byers-mazda-new"
base_url = "https://www.byersmazda.com"
search_path = "/new-inventory/index.htm"
kind = "dealer"

[[source]]
name = "byers-volvo"
base_url = "https://www.byersvolvo.com"
search_path = "/certified-inventory/index.htm"   # certified pre-owned only
kind = "dealer"

# Avis Car Sales: the second ex-rental channel, and another Dealer.com site,
# so the Hertz reader works unchanged. 1,594 cars nationwide on 2026-09-14,
# 408 under 25k miles, 29 CX-50 Hybrids (lowest 22k). Cars carry postal
# codes, so distances work; no Rent2Buy, no delivery quote on the page (the
# per-mile fallback applies); doc fee not in the price.
[[source]]
name = "avis"
base_url = "https://www.aviscarsales.com"
search_path = "/used-inventory/index.htm"

[[watch]]
tier = "A"
group = "primary"
label = "Mazda CX-50 Hybrid"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "hertz"
models = ["CX-50 Hybrid"]
threshold_pct = -3.0
national = true
year_min = 2025
odometer_max = 35000
poll_hours = 0.25
max_pages = 10
alert_on_new = true
new_max_residual_pct = 3.0

[[watch]]
tier = "A"
group = "primary"
label = "Mazda CX-50 / CX-70 (Hertz)"
source = "hertz"
models = ["CX-50", "CX-70"]
# The shape Lorenzo would buy used: a CX-50 Turbo, Premium or Meridian on
# 18-inch wheels or larger, a CX-70 Premium or above (the Preferred's rims
# are out). A deal here has to beat a new Turbo at 7 to 8% off plus $3,000
# cash, which is why the bar is 6% under the benchmark, not 3.
require_trims = ["Premium", "Turbo", "Meridian"]
exclude_trims = ["3.3 Turbo Preferred", "Preferred"]
min_wheel_inches = 18
threshold_pct = -6.0
national = true
year_min = 2025
odometer_max = 30000
poll_hours = 2
max_pages = 5
alert_on_new = false

[[watch]]
tier = "A"
group = "primary"
label = "Mazda CX-50 Hybrid (Avis)"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "avis"
models = ["CX-50 Hybrid"]
exclude_base_trims = true     # Avis stocks Preferred too; Hertz never did
threshold_pct = -3.0
national = true
year_min = 2025
odometer_max = 35000
poll_hours = 2
max_pages = 4
alert_on_new = true
new_max_residual_pct = 3.0

[[watch]]
tier = "B"
group = "hertz"
label = "Other Avis finds"
source = "avis"
models = ["Atlas", "GV70", "GV80", "CX-90", "CX-70", "XC60", "V60 Cross Country",
          "Sorento", "Telluride", "Santa Fe", "Santa Fe Hybrid", "Palisade",
          "C-Class", "GLA 250", "GLB 250", "GLE"]
threshold_pct = -8.0
national = false
year_min = 2024
odometer_max = 35000
poll_hours = 8
max_pages = 3
alert_on_new = true
new_max_residual_pct = 0.0
exclude_trims = ["Base", "SE Base", "Preferred", "3.3 Turbo Preferred", "LE", "LX", "S", "SE"]

# ---------------------------------------------------------------------------
# Enterprise Car Sales, low-mileage only. Its stock skews high-mileage
# (median 54k within 300 mi, 5% under 25k), so the reader applies the
# mileage cap and model year at the API and the watch names MAKES, not
# models: the API filters by make. Enterprise cars are inspected, carry a
# 12-month/12k powertrain warranty and a 7-day repurchase, and are stored
# as certified. Radius = alert_radius_miles.
# ---------------------------------------------------------------------------

[[watch]]
tier = "A"
group = "primary"
label = "Mazda CX-50 Hybrid (Enterprise)"
markdown_alert = true   # tell me when this one is cut into deal territory
source = "enterprise"
makes = ["Mazda"]
models = ["CX-50 Hybrid"]
exclude_base_trims = true
threshold_pct = -3.0
year_min = 2025
odometer_max = 25000
poll_hours = 6
alert_on_new = true
new_max_residual_pct = 3.0

[[watch]]
tier = "B"
group = "hertz"
label = "Low-mileage Enterprise finds"
source = "enterprise"
makes = ["Mazda", "Volvo", "Hyundai", "Kia", "Toyota", "Honda", "Volkswagen", "Subaru", "Genesis", "Lexus", "Audi", "Mercedes-Benz"]
year_min = 2024
odometer_max = 25000
price_min = 22000
price_max = 40000
body_styles = ["SUV", "Crossover", "Sedan", "Wagon"]
exclude_base_trims = true
threshold_pct = -8.0
# No board bar: this lane is under twenty low-mileage cars, all worth seeing;
# the Hertz sweep's bars exist because that lane is hundreds.
poll_hours = 12
alert_on_new = false
new_max_residual_pct = 0.0

# ---------------------------------------------------------------------------
# Other Hertz finds: the named upgrade list, polled daily.
# ---------------------------------------------------------------------------

[[watch]]
tier = "B"
group = "hertz"
label = "Other Hertz finds"
source = "hertz"
models = [
    "Atlas",                      # Volkswagen
    "GV70", "GV80",               # Genesis
    "CX-90",                      # Mazda -- Preferred excluded below
    "V60 Cross Country",          # Volvo: appears at Hertz (3 today)
    "Sorento", "Telluride",       # Kia: 25 Sorento at Hertz (LX/S only -> excluded below); Telluride 0
    "Santa Fe", "Santa Fe Hybrid",  # Hyundai: 1,290 Santa Fe, all SEL
    "C-Class", "GLA 250", "GLB 250", "GLE",   # Mercedes: 262 at Hertz, mostly GLA/GLB 250
]
threshold_pct = -8.0
national = false
year_min = 2024
odometer_max = 35000
poll_hours = 8
max_pages = 5
alert_on_new = true
new_max_residual_pct = 0.0
# Prefix-matched against the trim. Highlander is dropped from the list
# outright: Hertz stocks only the LE. CX-90 "Preferred" and "3.3 Turbo
# Preferred" are the base trims; Premium Sport and above stay.
exclude_trims = ["Base", "SE Base", "Preferred", "3.3 Turbo Preferred", "LE", "LX", "S", "SE"]

[[watch]]
tier = "B"
group = "hertz"
label = "Hyundai Palisade (2026 only)"
source = "hertz"
models = ["Palisade"]
threshold_pct = -8.0
year_min = 2026
odometer_max = 35000
poll_hours = 6
max_pages = 5
alert_on_new = true
new_max_residual_pct = 0.0

# ---------------------------------------------------------------------------
# Broad Hertz finds: a wider net for a nice, underpriced car in the
# $28-35k band. NOT the whole catalogue: that band is 10,551 cars (440
# pages) of Blazers, Rogues and Tiguans, and geoRadius is silently ignored,
# so "scan everything" is noise. This is a curated list of models Lorenzo
# would plausibly want, polled every two days, cheapest page each, and it
# alerts only on an exceptional discount. Add or drop models freely.
# ---------------------------------------------------------------------------

[[watch]]
tier = "B"
group = "hertz"
label = "Broad Hertz finds"
source = "hertz"
models = [
    "CX-50",                       # the gas sibling of the target
    "CX-5", "CX-90 PHEV",
    "RAV4 Hybrid", "Sienna", "Camry Hybrid",   # Highlander dropped: LE only at Hertz
    "CR-V Hybrid", "Accord Hybrid",
    "Santa Fe Hybrid", "Tucson Hybrid", "Sorento Hybrid", "Sportage Hybrid",
    "Outback", "Forester",
    "XC40", "S60",
    "Q5", "A4", "A6",
    "GLC", "C-Class",
    "X3", "3 Series",
]
threshold_pct = -8.0
national = false
year_min = 2024
odometer_max = 35000
poll_hours = 48
max_pages = 2
alert_on_new = false
new_max_residual_pct = 0.0
exclude_trims = ["Base", "SE Base", "Preferred", "3.3 Turbo Preferred", "LE", "LX", "S", "SE"]

# ---------------------------------------------------------------------------
# Very discounted, any trim. Lorenzo: "if base models, show me also VERY VERY
# discounted cars." Same models as Other Hertz finds plus the ones excluded
# there, with NO trim exclusions, and a bar of -10% below prediction. On the
# current distribution (p5 -5.5%, min -12.5%) that is a genuine outlier, so
# this lane fires rarely and only for something worth a second look.
# ---------------------------------------------------------------------------

[[watch]]
tier = "B"
group = "hertz"
label = "Very discounted, any trim"
source = "hertz"
models = ["Highlander", "CX-90", "Atlas", "GV80", "Palisade", "Sienna", "RAV4 Hybrid", "CX-50", "CX-5"]
threshold_pct = -10.0
board_max_residual_pct = -10.0   # the board shows this lane only past its bar
min_sigma = -2.0                 # ...and only two of the model's own sigmas below
national = false
year_min = 2024
odometer_max = 35000
poll_hours = 24
max_pages = 3
alert_on_new = false
new_max_residual_pct = 0.0

# ---------------------------------------------------------------------------
# Hertz 2026 sweep (2026-09-14). No model list: every 2026 car of these
# makes that Hertz prices between $25k and $35k, under 25k miles, as an
# SUV, sedan or wagon. Hertz applies the band, the mileage cap and the
# body styles server-side; the make's own trim ladder (hertz/trims.py)
# drops base trims (a Palisade SEL stays, an Audi Premium goes). The board
# shows a sweep car only at 6% or more below its benchmark; an alert needs
# 8% and a clean AutoCheck; and any make|model Hertz has never sold before
# gets one quiet push the run it appears. Sorted by mileage, capped per
# make, so the low-mileage end is what gets seen. Add or drop makes freely.
# ---------------------------------------------------------------------------

[[watch]]
tier = "B"
group = "hertz"
label = "Hertz 2026 sweep"
source = "hertz"
sweep = true
makes = ["Audi", "Mazda", "Volvo", "Mercedes-Benz", "Volkswagen", "Honda", "Toyota",
         "Genesis", "Lexus", "Subaru", "Hyundai", "Kia"]
year_min = 2026
year_max = 2026
price_min = 25000
price_max = 35000
odometer_max = 25000
body_styles = ["SUV", "Sedan", "Wagon"]
exclude_base_trims = true
threshold_pct = -8.0
board_max_residual_pct = -6.0
min_sigma = -2.0
national = false
poll_hours = 48
max_pages = 12
alert_on_new = false
new_max_residual_pct = 0.0

# ---------------------------------------------------------------------------
# New and certified Mazda CX-50 / CX-70 at dealers (Lorenzo, 2026-09-21):
# NA, turbo or hybrid, Premium or higher, ideally green or grey, terracotta
# interior loved. Four lanes, all on the "mazda" tab. The two tier-A lanes
# REQUIRE the colours and alert on every arrival and on markdowns; the two
# tier-B lanes take any colour, sit on the board, and alert only on a real
# discount. `require_trims` is any-of: "Premium" admits 2.5 S Premium,
# Hybrid Premium, Hybrid Premium Plus, 2.5 Turbo Premium Plus, 3.3 Turbo
# Premium / Premium Plus / S Premium and excludes Select, Preferred and the
# bare 2.5 Turbo. The Turbo Meridian Edition is admitted in the colour lanes
# only, because it is the CX-50 trim that carries terracotta leather.
#
# On a NEW car "vs model" is the pre-doc price against the sticker (Byers
# lists at sticker plus the $398 doc fee, so it reads about +0.2%; the
# manufacturer cash is shown separately). A certified car is scored like
# every other used car. Sources are Dealer.com pages of the dealer itself,
# read every few hours from the cloud; the wider market is the Cars.com
# sweep on the same tab (hertz/dream.py, MAZDA_MODELS).
# ---------------------------------------------------------------------------

# "mazdausa" is Mazda USA's own inventory locator (hertz/mazdausa.py): new
# and certified stock at every dealer within the alert radius, twenty of
# them from Cincinnati to Cleveland, Pittsburgh, Detroit and Indianapolis,
# with exterior AND interior colour, trim and sticker. It is what covers
# Germain's two Columbus stores (Dealer Inspire, not Dealer.com). A VIN that
# Byers's own page carries stays with that page, which also knows the doc
# fee, the internet price and the manufacturer cash.
[[watch]]
tier = "A"
group = "mazda"
label = "Mazda in your colours (new)"
markdown_alert = true
sources = ["byers-mazda-new", "mazdausa"]
require_stock = "new"
# 150 mi, not 75: the nearest terracotta car with big wheels is 90 miles
# away (Dover) and the only Cypress one is at Troy, 174. A 75-mile alert
# radius would have been silent on both.
alert_radius_miles = 150
models = ["CX-50", "CX-50 Hybrid", "CX-70"]
require_trims = ["Premium", "Turbo", "Meridian"]
min_wheel_inches = 18           # 19-20 preferred, but Lorenzo will take the Meridian's 18-inch
                                # all-terrains (2026-09-21); still drops every 17-inch car, i.e.
                                # S Select, S Preferred, Hybrid Preferred and Hybrid Premium
# Cypress is the only green Mazda makes here, and only on the 2.5 S and
# Turbo; Polymetal and Machine are the two greys he will take.
# 2026-09-22: no Machine Gray; Ingot Blue welcome on the turbo.
require_exterior = ["cypress", "polymetal", "ingot"]
require_interior = ["terracotta", "brown", "cognac", "caramel", "saddle", "tan"]
threshold_pct = -6.0            # vs sticker, before manufacturer cash
year_min = 2025
odometer_max = 500
poll_hours = 4
max_pages = 3
alert_on_new = true
new_max_residual_pct = 99.0     # any price: a car in your spec is worth a message

