# Hertz deal monitor — configuration.
#
# Secrets are NOT stored here. They come from environment variables so this
# file is safe to commit:
#   HERTZ_SMTP_USER, HERTZ_SMTP_PASSWORD, HERTZ_EMAIL_TO, HERTZ_NTFY_TOPIC
#
# Model matching is done LOCALLY against the full inventory pull, using
# case-insensitive substring matching. That deliberately sidesteps Hertz's
# exact-string trap, where "CX-50" and "CX-50 Hybrid" are distinct model
# values and filtering on the wrong one silently returns nothing.

[location]
zip = "43220"                 # Upper Arlington / Columbus, OH
# These pin the search origin via cookies. Without them Hertz has no location
# for the session: every vehicle comes back with a null distance and the
# radius filter is silently ignored. They also make results independent of
# where the job runs, which matters on GitHub Actions runners.
city_state = "COLUMBUS, OH, US"
coordinates = "40.0464,-83.0680"
alert_radius_miles = 300      # push alerts only for cars you could drive to
# Mention a national car in the digest only if it beats the best drivable
# car by at least this much, on landed cost. Set to 0 to always mention.
national_mention_min_saving = 1500

[economics]
# Franklin County OH: 5.75% state + 1.25% county + 0.50% COTA LinkUS levy
# (effective April 2025). Verified 2026-09-09 for the 43220 jurisdiction.
sales_tax_rate = 0.080
title_reg_fees = 100          # title + registration, approximate
tax_applies_to_delivery = false
# Ohio does not tax the dealer doc fee, so the taxable base is the
# no-haggle price rather than the quoted Hertz Price.
tax_excludes_doc_fee = true

# Hertz quotes delivery on each vehicle page; these are the fallback when the
# quote cannot be read. Calibrated 2026-09-08 from two live quotes:
# Cincinnati 86 mi -> $316, Phoenix 1656 mi -> $3,464.
[economics.delivery]
base = 145.0
per_mile = 2.00

# Five-year cost of ownership, as shown on the board. Resale uses each
# model's own market curve where one exists (XC60 -9.4%/yr, CX-70 -7.5%),
# else this default, with the fitted mileage slope; fuel from the car's
# EPA figures at the mileage chosen on the page; a reserve when the
# bumper-to-bumper warranty has run out.
fuel_price = 3.20
depreciation_per_year = -0.08
warranty_reserve = 1500

[carmax]
# CarMax prices shipping per car and shows it on the results page. Anything
# dearer than this is not worth the freight.
max_shipping = 499

[github]
# Followed listings live as open issues labelled "follow" on this repo; the
# board's star button pre-fills one, closing it un-follows. Issues must be
# enabled on the repo for this to work.
repo = "loremagno/hertz-deal-monitor"

[fleet_drop]
# Lorenzo, from having bought at Hertz before: "they start offloading a
# model, a bunch of listings go up, then demand catches up; we need to be
# there catching that flurry." The residual cannot see this. A model-wide
# price drop is absorbed by that model's own fixed effect, so three hundred
# cheap CX-50s would each read as average against a benchmark they
# themselves just moved. So this watches counts instead, against the same
# model's own recent arrival rate, and reports where its price level sits.
#
# Judged on cars inside the radius, because a wave of ninety Atlases in
# Texas is not an opportunity at $2 a mile in delivery. Fires when a watched
# model brings in at least `min_drivable` cars you could drive to AND that
# is at least `multiple` times what that model usually brings. Only arrivals
# matching a watch count, or a flood of base-trim Sportages fires every run.
#
# Tuned by replaying nine days of real arrivals: at 4 and 2.0 it fired twice,
# on a 24-car Palisade wave (4 drivable) and a 69-car CX-50 wave (9 drivable),
# about twice a week. At 3 and 2.0 it fired seven times, which is noise.
alert = true
min_drivable = 4
multiple = 2.0
window_days = 14

[condition]
# Reading a car's history costs two page loads and the answer is good for a
# fortnight, so the board can afford a verdict on every car Lorenzo could
# actually drive to, not just the ones heading for an alert. On 2026-09-17
# the drivable board was 91 cars with 3 verdicts between them, which is the
# one column he most needs and the thing he was burned by. At 30 a run the
# backfill takes about three runs and then only new arrivals cost anything.
survey_per_run = 30
survey_seconds = 360
retry_days = 14

[preferences]
# Soft preferences, not filters. A car that misses them still appears on the
# board and can still alert; the board and the alert say how it differs.
# 2026-09-21, for the new/CPO Mazda watch: "ideally green or grey". Green
# is Mazda's Cypress (2.5 S and Turbo only, never the Hybrid); grey is
# Polymetal or Machine Gray. Blue stays from the CX-50 Hybrid days.
colors = ["blue", "slate", "gray", "grey", "graphite", "machine", "polymetal", "cypress", "green"]
trims = ["Premium Plus"]
odometer_ideal = 20000
odometer_tolerance = 8000     # "ideally under 20k, but not much more"
# Starting values for the cost view's selectors; the page lets you change
# both, because how much you will drive is the open question.
miles_per_year = 12000
holding_years = 5
# The dealer tab's default "Away" and its count: Columbus plus Springfield
# and Dayton. The tab still holds every dealer within the alert radius.
dealer_radius_miles = 75

[scoring]
# A residual is only trusted when the car's model has at least this many
# observations in the fit; below that the model dummy is doing the work.
min_comps = 12
# A car must be at least this many dollars below prediction before the
# percentage test is even considered, to avoid alerting on rounding noise.
min_abs_discount = 400
# When a Cars.com curve exists for a model, the within-inventory fit gets
# weight n / (n + K) and the curve the rest, EXCEPT that the curve never
# falls below `market_weight_floor`.
#
# Lorenzo, 2026-09-18: "we are comparing cars to other Hertz listings? I
# would like to benchmark more to the global market, because otherwise a
# wave of cheap cars changes the model." Exactly right, and it is the whole
# weakness of a within-inventory benchmark: it is fitted on the same sellers
# it judges, with a fixed effect per model, so a fleet offload moves the
# yardstick with the cars and every one reads as ordinary. The Cars.com
# curve is noisier but exogenous, so it leads.
market_blend_k = 20
market_weight_floor = 0.6
# A Cars.com sample that fits this badly is not worth 60% of the verdict;
# such a model keeps the internal benchmark. On 2026-09-18 the loosest of
# the nineteen curves was the GV70 at 0.097, so nothing is excluded today.
market_max_rmse = 0.12
# Markdown alerts, on watches that set `markdown_alert = true`. A car that
# arrives at prediction and is cut week by week until it is genuinely cheap
# used to say nothing: arrival alerts fire once, and the value gate wants
# the tier bar. It must now sit at or below this many standard deviations
# under its own model, and the cut must be at least this much money. On the
# board of 2026-09-17, 573 drops in one run left exactly one car past -1.5.
#
# EITHER bar passes. One alone does not work across models: the XC60 is
# scored against a Cars.com curve whose spread is 6.0% of price, so -1.5
# sigma there means -9% and never fires, while the CX-50 Hybrid sits on the
# within-inventory fit at a 3.2% spread. Over the first eight days of price
# history the sigma bar alone fired 0 times and the percentage bar once, on
# a certified XC60 thirteen miles away that had been cut $600.
markdown_pct = -5.0
markdown_sigma = -1.5
markdown_min_drop = 250

[alerts]
enable_email = true
enable_push = true
digest_every_days = 3
# Never re-alert the same VIN unless its price falls another N dollars.
realert_price_drop = 500
# Quiet mode (Lorenzo, 2026-09-23: "stop notifications; ONLY new additions on
# Hertz that are great deals for the models we target"). Only a car that is
# new this run, sold by one of `push_sources`, of one of `push_models`, and
# under its benchmark by its lane's threshold with a clean AutoCheck alerts.
# Delete both lines to restore every alert.
push_sources = ["hertz"]
push_models = ["CX-50", "CX-50 Hybrid", "CX-70"]

[email]
smtp_server = "smtp.gmail.com"
smtp_port = 587

[push]
# ntfy.sh — free, no account. Pick an unguessable topic name and subscribe
# to it in the ntfy app. Set via HERTZ_NTFY_TOPIC.
server = "https://ntfy.sh"

# ---------------------------------------------------------------------------
# Watchlist. Tier A is the real target and alerts on a modest discount.
# Tier B is opportunistic: it only fires on an exceptional discount.
# ---------------------------------------------------------------------------

